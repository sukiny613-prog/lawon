<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAW:ON</title>
<style>
:root{--navy:#111c35;--blue:#4f7cff;--sky:#eaf0ff;--ink:#182033;--muted:#778198;--line:#e7ebf2;--bg:#f7f8fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.top{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:20}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo i{color:var(--blue);font-style:normal}.nav{font-size:13px;color:var(--muted)}
.hero{background:var(--navy);color:white;padding:70px 7% 85px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#4f7cff22;right:-100px;top:-160px}
.hero h1{font-size:44px;letter-spacing:-2px;margin:0 0 13px;position:relative;z-index:1}.hero p{margin:0;color:#c7d0e3;font-size:17px;position:relative;z-index:1}
.searchbox{max-width:1050px;margin:-35px auto 0;position:relative;z-index:5;padding:0 20px}
.search{background:white;border:1px solid var(--line);box-shadow:0 15px 40px #111c3520;border-radius:20px;padding:9px;display:flex}
.search input{flex:1;border:0;outline:0;font-size:17px;padding:16px 18px;background:transparent}.search button{border:0;background:var(--blue);color:white;font-weight:800;border-radius:14px;padding:0 28px;font-size:15px}
.wrap{max-width:1120px;margin:0 auto;padding:30px 20px 70px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;color:#59657b;cursor:pointer}.chip.active{background:var(--sky);color:#315fd5;border-color:#cbd8ff;font-weight:800}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head h2{margin:0;font-size:24px}.count{color:var(--muted);font-size:13px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #18203312;border-color:#cdd8ef}
.badge{font-size:11px;color:#315fd5;background:var(--sky);padding:5px 9px;border-radius:999px;font-weight:800}.card h3{font-size:16px;line-height:1.45;margin:13px 0 9px}.card small{color:var(--muted);line-height:1.5}
.detail{display:none;margin-top:22px;background:white;border:1px solid var(--line);border-radius:20px;padding:28px}.detail.show{display:block}.detail h2{margin:10px 0 18px;font-size:25px}.law{background:#f8faff;border:1px solid #dfe7fa;border-radius:14px;padding:18px;line-height:1.7}.law b{color:#315fd5}.official{display:inline-block;margin-top:17px;text-decoration:none;background:var(--navy);color:white;padding:12px 17px;border-radius:11px;font-weight:800}.desc{color:#59657b;line-height:1.75}
.empty{grid-column:1/-1;background:white;border:1px dashed #ccd5e5;border-radius:18px;padding:45px;text-align:center;color:var(--muted)}
footer{background:var(--navy);color:#bdc6d8;padding:28px 7%;font-size:12px;line-height:1.7}
@media(max-width:850px){.results{grid-template-columns:1fr 1fr}.hero h1{font-size:35px}}@media(max-width:600px){.results{grid-template-columns:1fr}.search button{padding:0 18px}.search input{font-size:15px}}
</style></head>
<body>
<header class="top"><div class="logo">LAW:<i>ON</i></div><div class="nav">청소년 생활법률 정보</div></header>
<section class="hero"><h1>어려운 법, 내 상황에 맞게 ON.</h1><p>궁금한 상황을 검색하면 관련 분야의 예상 Q&A와 법률 조항을 연결해 드려요.</p></section>
<div class="searchbox"><div class="search"><input id="search" placeholder="예: 알바비를 못 받았어요 / 환불 / 미성년자 계약 / 학교폭력"><button id="go">검색</button></div></div>
<main class="wrap">
<div class="chips" id="chips"></div>
<div class="head"><h2 id="heading">전체 예상 Q&A</h2><div class="count" id="count"></div></div>
<section class="results" id="results"></section>
<section class="detail" id="detail"></section>
</main>
<footer>LAW:ON은 청소년의 생활 속 법률정보 접근성을 높이기 위한 교육용 프로토타입입니다. 검색 결과는 미리 구성한 예시이며 실제 법률 판단을 대신하지 않습니다. 공식 법령 원문은 국가법령정보센터에서 확인하세요.</footer>

const EXTRA=[{"q": "내가 청소년에게 담배를 팔았어", "cat": "형사·분쟁", "law": "청소년보호법 관련 규정", "title": "청소년 대상 담배 판매 관련 규정", "url": "https://www.law.go.kr/법령/청소년보호법", "keywords": ["청소년", "담배", "판매"]}, {"q": "알바하는데 근로계약서를 안 써줬어요", "cat": "노동·아르바이트", "law": "근로기준법 제17조", "title": "근로조건의 명시", "url": "https://www.law.go.kr/법령/근로기준법/제17조", "keywords": ["알바", "근로계약서", "계약서"]}, {"q": "미성년자인데 부모님 몰래 계약했어요", "cat": "계약·민법", "law": "민법 제5조", "title": "미성년자의 능력", "url": "https://www.law.go.kr/법령/민법/제5조", "keywords": ["미성년", "부모", "계약"]}];
const categories=Object.keys(DB);
let active="전체";
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"");}
function all(){let a=[];categories.forEach(c=>DB[c].forEach(x=>a.push(x)));EXTRA.forEach(x=>a.push(x));return a;}
function relevance(x,q){let n=norm(q), score=0; if(!n)return 0; if(norm(x.q).includes(n))score+=100; (x.keywords||[]).forEach(k=>{if(n.includes(norm(k))||norm(k).includes(n))score+=30}); [x.law,x.title,x.cat].forEach(v=>{if(norm(v).includes(n))score+=20}); return score;}
function render(q=""){let items=all(); if(active!=="전체")items=items.filter(x=>x.cat===active); if(q.trim()){items=items.map(x=>({...x,score:relevance(x,q)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);}
document.getElementById("heading").textContent=q.trim()?"검색 결과":(active==="전체"?"전체 예상 Q&A":active+" 예상 Q&A");
document.getElementById("count").textContent=`${items.length}개`;
const r=document.getElementById("results"); r.innerHTML=items.slice(0,60).map((x,i)=>`<article class="card" data-index="${i}"><span class="badge">${x.cat}</span><h3>${x.q}</h3><small>${x.law} · ${x.title}</small></article>`).join("")||'<div class="empty">관련 질문을 찾지 못했어요.<br>예: <b>알바</b>, <b>근로계약서</b>, <b>환불</b>, <b>미성년자</b>, <b>개인정보</b>, <b>학교폭력</b> 등을 검색해 보세요.</div>';
r.querySelectorAll(".card").forEach((el,i)=>el.onclick=()=>show(items.slice(0,60)[i])); document.getElementById("detail").classList.remove("show");}
function show(x){const d=document.getElementById("detail"); d.innerHTML=`<span class="badge">${x.cat}</span><h2>${x.q}</h2><p class="desc">이 질문은 <b>${x.cat}</b> 분야의 예상 질문입니다. 아래 법률과 조문을 확인한 뒤, 공식 원문에서 정확한 내용을 살펴보세요.</p><div class="law"><b>${x.law}</b><br>${x.title}<br><br><span>관련 법률의 기준을 확인할 수 있습니다. 구체적인 사실관계와 법령의 개정 여부에 따라 적용 결과가 달라질 수 있습니다.</span></div><a class="official" href="${x.url}" target="_blank" rel="noopener">국가법령정보센터에서 조문 보기 ↗</a>`;d.classList.add("show");d.scrollIntoView({behavior:"smooth",block:"start"});}
function setup(){const c=document.getElementById("chips");c.innerHTML=['전체',...categories].map(x=>`<button class="chip ${x===active?'active':''}" data-cat="${x}">${x}</button>`).join("");c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.cat;c.querySelectorAll(".chip").forEach(z=>z.classList.remove("active"));b.classList.add("active");render(document.getElementById("search").value);});}
document.getElementById("go").onclick=()=>render(document.getElementById("search").value);
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")render(e.target.value)});
setup();render();
</script></body></html>
